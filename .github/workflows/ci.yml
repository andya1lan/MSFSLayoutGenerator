name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o dist/MSFSLayoutGenerator.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: MSFSLayoutGenerator
          path: dist/MSFSLayoutGenerator.exe
          if-no-files-found: error
